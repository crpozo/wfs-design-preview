<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Build Your Fence · Western Fence Supply, Design Preview</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900&family=Inter:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />

</head>
<body>
<div id="wfs-header"></div>

<section class="wfs-hero wfs-hero--slim">
  <img class="wfs-hero__img" src="assets/ALUM.webp" alt="" aria-hidden="true" />
  <div class="wfs-hero__scrim" aria-hidden="true"></div>
  <div class="container wfs-hero__inner">
    <span class="wfs-hero__eyebrow"><i aria-hidden="true"></i>Specs · Build your fence</span>
    <h1 class="wfs-hero__title">Build It<br><span class="wfs-hero__accent">Step By Step.</span></h1>
    <p class="wfs-hero__sub">Pick the material, then the profile, height and finish. The drawing updates as you go, and the spec sheet comes with it.</p>
  </div>
</section>

<section class="bld">
  <div class="container">
    <!-- El configurador se monta aqui. El mismo modulo se usa dentro de las
         fichas de material y de porton, fijando ese material o tipo. -->
    <div id="builder"></div>
  </div>
</section>

<div id="wfs-footer"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/site-header.jsx"></script>
<script type="text/babel" src="components/page-blocks.jsx"></script>
<script type="text/babel" src="components/sections.jsx"></script>
<script type="text/babel" src="components/extras.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById("wfs-header")).render(<SiteHeader active="Fence Education Hub" />);
ReactDOM.createRoot(document.getElementById("wfs-footer")).render(<Footer />);
</script>
<script src="fence-builder.js"></script>
<script>
  /* Suelto: sin fijar nada, se pregunta todo. Con ?m= o ?g= se precarga. */
  (function () {
    var q = new URLSearchParams(location.search);
    var g = q.get('g'), mat = q.get('m'), img = q.get('p');
    var opts = {};
    if (g) { opts.product = 'gate'; opts.gate = g; }
    else if (mat) { opts.product = 'fence'; opts.material = mat; }
    var api = WFSBuilder.mount(document.getElementById('builder'), opts);
    if (img && api) { api.elegirPorImagen(img); }
  })();
</script>
</body>
</html>
