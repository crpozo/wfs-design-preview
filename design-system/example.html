<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WFS — Fence selector (design system demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900&family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="wfs-design-system.css">
<style>
  /* ── Cascaron de pantalla completa ───────────────────────────────────────
     La altura manda: la pagina ocupa el viewport y es la zona de contenido la
     que se encoge, no el usuario el que hace scroll. Si aun asi no cabe (una
     ventana muy baja), #body scrollea solo el, nunca la pagina entera. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--ink); color:#fff; padding: 12px 0; flex: none; }
  .topbar .container { display:flex; justify-content:space-between; align-items:center; gap:20px; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 0 20px; }
  main > .container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #body { flex: 1; min-height: 0; overflow: auto; }

  /* Cabecera mas compacta que en una pagina larga */
  .steps { margin-bottom: 18px; }
  .section-header { padding-bottom: 14px; margin-bottom: 18px; gap: 32px; }
  .section-header h2 { font-size: clamp(24px, 2.6vw, 34px); }
  .section-header p { font-size: 14.5px; }

  /* Paso 1: cinco tarjetas que llenan el alto disponible */
  /* Las tarjetas miden por contenido y se alinean arriba: con 'contain' el
     panel es pequeno, y estirarlas dejaba 400px de blanco por tarjeta. */
  .grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; align-items:start; }
  .grid-5 .pick { display:flex; flex-direction:column; padding:0; }
  .grid-5 .media { aspect-ratio:4/3; }

  /* Paso 2: foto a un lado, datos al otro, en vez de apilado */
  .detail { display:grid; grid-template-columns:0.9fr 1.1fr; gap:28px; height:100%; min-height:0; }
  .detail .media--product { aspect-ratio: 4/3; }
  .detail__side { min-height:0; overflow:auto; }

  /* Paso 3 y resumen */
  .grid-2 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 20px; }
  .row    { display:flex; gap:10px; flex-wrap:wrap; }
  .spec   { display:grid; grid-template-columns:132px 1fr; gap:4px 18px; padding:10px 0;
            border-bottom:1px solid rgba(0,16,17,.10); font-size:15px; line-height:1.45; }
  .spec dt { font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:.16em;
             text-transform:uppercase; color:var(--charcoal); }
  .spec dd { margin:0; }
  .nav { display:flex; justify-content:space-between; gap:12px; margin-top:18px; flex:none; }

  /* Ventana ESTRECHA: se apila en una columna. */
  @media (max-width: 1000px) {
    body { overflow: auto; }
    .grid-5, .detail { height:auto; grid-template-columns:1fr; }
    .grid-5 .media, .detail .media { aspect-ratio: 16/9; height:auto; }
    .grid-2 { grid-template-columns:repeat(2,1fr); }
  }
  /* Ventana BAJA pero ancha: conserva las cinco columnas, solo deja scrollear.
     Van en reglas separadas a proposito: combinarlas con coma mandaba una
     ventana ancha y baja al diseño de movil, que es justo lo que no toca. */
  @media (max-height: 620px) {
    body { overflow: auto; }
    .grid-5, .detail { height:auto; }
    .grid-5 .media { aspect-ratio: 4/3; }
    .detail .media { aspect-ratio: 16/9; height:auto; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <strong class="display-extended" style="font-size:18px">WESTERN FENCE SUPPLY</strong>
    <span class="kicker" style="color:var(--blue-ice)">DESIGN SYSTEM · LIVE DEMO</span>
  </div>
</div>

<main>
  <div class="container">

    <div class="steps" id="steps"></div>

    <div class="section-header">
      <h2 class="display" id="title"></h2>
      <div class="right"><p id="sub"></p></div>
    </div>

    <div id="body"></div>

    <div class="nav">
      <button class="btn btn-ghost" id="back" style="border-radius:2px">← Back</button>
      <button class="btn btn-primary" id="next" style="border-radius:2px">Continue →</button>
    </div>
  </div>
</main>

<script>
/* Datos reales, tomados del copy del propio sitio (page-edu.jsx, la tabla de
   garantia y las descripciones SEO). Nada inventado. */
/* Las mismas fotos que usa el sitio (FENCE_IMG en components/shared.jsx). */
var IMG = {
  vinyl:        '../assets/compare/vinyl.webp',
  aluminum:     '../assets/compare/aluminum.webp',
  'chain-link': '../assets/compare/chainlink.webp',
  metal:        '../assets/compare/metal.webp',
  ecfence:      '../assets/profiles/ecfence-bronze.jpg'
};

/* Una foto por opcion concreta: al cambiar el estilo, cambia el panel.
   Los archivos ya existen en assets/profiles, no hay nada que producir. */
var OPTION_IMG = {
  vinyl:        { 'Privacy':'vinyl-privacy', 'Picket':'vinyl-picket', 'Ranch rail':'vinyl-ranch-rail' },
  aluminum:     { 'Smooth bottom':'aluminum-2-rail-smooth', 'Rake bottom':'aluminum-3-rail-rake', 'Puppy picket':'aluminum-puppy-picket' },
  'chain-link': { 'Galvanized':'chainlink-galvanized', 'Black PVC-coated':'chainlink-black', 'Green PVC-coated':'chainlink-green' },
  metal:        { 'Modern':'metal-modern', 'Original':'metal-original', 'P1':'metal-p1' },
  ecfence:      { 'Bronze':'ecfence-bronze', 'White':'ecfence-white' }
};
function optionImg(m) {
  var f = OPTION_IMG[m.id] && OPTION_IMG[m.id][state.option];
  return f ? '../assets/profiles/' + f + '.jpg' : IMG[m.id];
}

var MATERIALS = [
  { id:'vinyl', name:'Vinyl / PVC', tag:'Catalyst-extruded PVC',
    bestFor:'Backyard privacy, residential subdivisions',
    strength:'Low-upkeep privacy, no painting, made for Florida sun',
    caveat:'Wind performance varies by profile, ask for specs for your area',
    warranty:'Lifetime structural · Lifetime UV',
    optionLabel:'Profile', options:['Privacy','Picket','Ranch rail'],
    heights:["4'","5'","6'"] },

  { id:'aluminum', name:'Aluminum', tag:'Powder-coat · 6063-T6',
    bestFor:'Pool enclosures, ornamental perimeters',
    strength:'Pool-code compliant options, clean ornamental look',
    caveat:'Open picket, limited privacy by design',
    warranty:'Lifetime structural · 20-year finish',
    optionLabel:'Bottom style', options:['Smooth bottom','Rake bottom','Puppy picket'],
    heights:["4'","5'","6'"] },

  { id:'chain-link', name:'Chain Link', tag:'Galvanized + vinyl-coated',
    bestFor:'Security, sports fields, industrial perimeters',
    strength:'Budget-friendly, parts sold individually, strong stock availability',
    caveat:'Industrial look, not for ornamental front yards',
    warranty:'Rust-thru · 15-year color on PVC-coated',
    optionLabel:'Finish', options:['Galvanized','Black PVC-coated','Green PVC-coated'],
    heights:["4'","5'","6'","8'"] },

  { id:'metal', name:'Metal / DuraFence', tag:'Aluminum board privacy',
    bestFor:'Modern privacy, residential and commercial',
    strength:'Full privacy board look in Modern, Original and P1 styles',
    caveat:'Lead time varies by color and quantity',
    warranty:'20 years structural · 10-year finish',
    optionLabel:'Style', options:['Modern','Original','P1'],
    heights:["6'","8'"] },

  { id:'ecfence', name:'EC Fence', tag:'Self-mating galvanized steel',
    bestFor:'Coastal properties, commercial perimeters, modern residential',
    strength:'Galvanized steel privacy panels built for salt air',
    caveat:'Quote-based pricing, call for run-specific cost',
    warranty:'Lifetime structural · 20-year finish',
    optionLabel:'Color', options:['Bronze','White'],
    heights:["6'"] }
];

var maxStep = 0;
var state = { step: 0, mat: null, option: null, height: null,
              feet:'', gates:'', zip:'', when:'', name:'', email:'', phone:'' };

var STEPS = ['Fence', 'Details', 'Your project', 'Summary'];
var $ = function (id) { return document.getElementById(id); };
var mat = function () { return MATERIALS.filter(function(m){ return m.id === state.mat; })[0]; };

function renderSteps() {
  var h = '';
  STEPS.forEach(function (s, i) {
    if (i) h += '<span class="bar' + (i <= state.step ? ' on' : '') + '"></span>';
    var can = i <= maxStep;
    h += '<button class="dot' + (i <= state.step ? ' on' : '') + '" data-step="' + i + '"' +
         (can ? '' : ' disabled') + ' aria-current="' + (i === state.step) + '">' + (i+1) + '. ' + s + '</button>';
  });
  $('steps').innerHTML = h;
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function render() {
  /* Hasta donde se puede saltar: el ultimo paso cuyos requisitos estan cubiertos.
     Si el usuario cambia de material a mitad, esto se encoge solo y los pasos
     de mas adelante se vuelven a bloquear. */
  var reach = 0;
  if (state.mat) reach = 1;
  if (reach === 1 && state.option && state.height) reach = 2;
  if (reach === 2 && state.feet && state.zip && state.name) reach = 3;
  maxStep = reach;
  if (state.step > maxStep) state.step = maxStep;
  renderSteps();
  var m = mat();

  if (state.step === 0) {
    $('title').innerHTML = 'Start With The<br><span class="accent">Material.</span>';
    $('sub').textContent = 'Pick a system and we show what it is good at, what it is not, and what the warranty covers.';
    $('body').innerHTML = '<div class="grid-5">' + MATERIALS.map(function (x, i) {
      return '<button class="pick" data-mat="' + x.id + '" aria-pressed="' + (state.mat === x.id) + '" style="padding:0">' +
        '<span class="media media--product"><img src="' + IMG[x.id] + '" alt="' + esc(x.name) + ' fence panel" decoding="async"' +
          (i === 0 ? ' fetchpriority="high"' : '') + '></span>' +
        '<span style="display:block;padding:22px">' +
        '<span class="kicker">' + esc(x.tag) + '</span>' +
        '<span style="display:block;font-size:19px;font-weight:700;margin:10px 0 8px;line-height:1.2">' + esc(x.name) + '</span>' +
        '<span style="display:block;font-size:14.5px;color:var(--charcoal);line-height:1.5">' + esc(x.bestFor) + '</span>' +
        '</span>' +
      '</button>';
    }).join('') + '</div>';
  }

  else if (state.step === 1) {
    $('title').innerHTML = esc(m.name) + '<br><span class="accent">At A Glance.</span>';
    $('sub').textContent = 'These are the trade-offs before you commit. Then pick your build.';
    $('body').innerHTML =
      '<div class="detail">' +
      '<div>' +
        '<div class="media media--product" style="border:1.5px solid var(--ink)">' +
          '<img src="' + optionImg(m) + '" alt="' + esc(m.name) + ' ' + esc(state.option || '') + ' panel" decoding="async">' +
        '</div>' +
        '<div style="margin-top:12px">' +
          '<span class="kicker">' + esc(m.tag) + '</span>' +
          '<div class="display" style="font-size:clamp(20px,2vw,26px);margin-top:4px">' +
            esc(state.option || m.name) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail__side">' +
      '<dl style="margin:0 0 22px">' +
        row('Best for', m.bestFor) +
        row('Strength', m.strength) +
        row('Trade-off', m.caveat) +
        row('Warranty', m.warranty) +
      '</dl>' +
      '<div style="margin-bottom:20px">' +
        '<span class="kicker" style="color:var(--charcoal)">' + esc(m.optionLabel) + '</span>' +
        '<div class="row" style="margin-top:12px">' + m.options.map(function (o) {
          return '<button class="choice" data-opt="' + esc(o) + '" aria-pressed="' + (state.option === o) + '">' + esc(o) + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div>' +
        '<span class="kicker" style="color:var(--charcoal)">Height</span>' +
        '<div class="row" style="margin-top:10px">' + m.heights.map(function (hgt) {
          return '<button class="choice" data-h="' + esc(hgt) + '" aria-pressed="' + (state.height === hgt) + '">' + esc(hgt) + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      '</div></div>';
  }

  else if (state.step === 2) {
    $('title').innerHTML = 'Now The<br><span class="accent">Project.</span>';
    $('sub').textContent = 'Four numbers and we can price it. Everything else we confirm by phone.';
    $('body').innerHTML = '<div class="grid-2">' +
      field('feet',  'Linear feet',        'number', 'e.g. 180') +
      field('gates', 'How many gates',     'number', 'e.g. 2') +
      field('zip',   'Project ZIP',        'text',   'e.g. 33901') +
      select('when', 'Timeline', ['This week','2 to 4 weeks','1 to 3 months','Just pricing']) +
      field('name',  'Name',   'text',  'Full name') +
      field('email', 'Email',  'email', 'you@company.com') +
      field('phone', 'Phone',  'tel',   '(239) 689-5496') +
    '</div>';
  }

  else {
    $('title').innerHTML = 'Ready To<br><span class="accent">Send.</span>';
    $('sub').textContent = 'This is what a rep would receive. Nothing is submitted, it is a demo.';
    $('body').innerHTML =
      '<div style="background:var(--ink);color:#fff;padding:32px;box-shadow:12px 12px 0 var(--tangerine)">' +
        '<span class="kicker" style="color:var(--tangerine)">MATERIAL QUOTE REQUEST</span>' +
        '<div class="display-extended" style="font-size:clamp(22px,2.4vw,32px);margin:10px 0 18px">' +
          esc(m.name) + ' · ' + esc(state.height || '—') +
        '</div>' +
        '<dl style="margin:0">' +
          rowDark(m.optionLabel, state.option || '—') +
          rowDark('Height', state.height || '—') +
          rowDark('Linear feet', state.feet || '—') +
          rowDark('Gates', state.gates || '—') +
          rowDark('ZIP', state.zip || '—') +
          rowDark('Timeline', state.when || '—') +
          rowDark('Contact', [state.name, state.email, state.phone].filter(Boolean).join(' · ') || '—') +
        '</dl>' +
      '</div>';
  }

  $('back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  $('next').textContent = state.step === 3 ? 'Start over' : 'Continue →';
  $('next').disabled = !canAdvance();
  $('next').style.opacity = canAdvance() ? '1' : '.4';
  $('next').style.cursor = canAdvance() ? 'pointer' : 'not-allowed';
}

function row(k, v)     { return '<div class="spec"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>'; }
function rowDark(k, v) { return '<div class="spec" style="border-color:rgba(255,255,255,.18)">' +
  '<dt style="color:var(--blue-ice)">' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>'; }
function field(id, label, type, ph) {
  return '<div class="field"><label for="f-' + id + '">' + esc(label) + '</label>' +
    '<input id="f-' + id + '" type="' + type + '" placeholder="' + esc(ph) + '" value="' + esc(state[id]) + '"></div>';
}
function select(id, label, opts) {
  return '<div class="field"><label for="f-' + id + '">' + esc(label) + '</label><select id="f-' + id + '">' +
    '<option value="">Select…</option>' +
    opts.map(function (o) { return '<option' + (state[id] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
    '</select></div>';
}
function canAdvance() {
  if (state.step === 0) return !!state.mat;
  if (state.step === 1) return !!state.option && !!state.height;
  if (state.step === 2) return !!state.feet && !!state.zip && !!state.name;
  return true;
}

document.addEventListener('click', function (e) {
  var s = e.target.closest('[data-step]');
  if (s && !s.disabled) { state.step = +s.dataset.step; render(); window.scrollTo(0,0); return; }
  var p = e.target.closest('[data-mat]');
  if (p) { if (state.mat !== p.dataset.mat) { state.option = null; state.height = null; }
           state.mat = p.dataset.mat; return render(); }
  var o = e.target.closest('[data-opt]'); if (o) { state.option = o.dataset.opt; return render(); }
  var h = e.target.closest('[data-h]');   if (h) { state.height = h.dataset.h;   return render(); }
});
document.addEventListener('input', function (e) {
  var m = (e.target.id || '').match(/^f-(.+)$/);
  if (m) { state[m[1]] = e.target.value; $('next').disabled = !canAdvance();
           $('next').style.opacity = canAdvance() ? '1' : '.4'; }
});
document.addEventListener('change', function (e) {
  var m = (e.target.id || '').match(/^f-(.+)$/);
  if (m && e.target.tagName === 'SELECT') { state[m[1]] = e.target.value; render(); }
});
$('next').addEventListener('click', function () {
  if (state.step === 3) { state = { step:0, mat:null, option:null, height:null,
    feet:'', gates:'', zip:'', when:'', name:'', email:'', phone:'' }; }
  else if (canAdvance()) { state.step++; }
  render(); window.scrollTo(0, 0);
});
$('back').addEventListener('click', function () { if (state.step) state.step--; render(); window.scrollTo(0,0); });

render();
</script>
</body>
</html>
